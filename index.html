<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f6" />
    <meta name="description" content="Turn local audio into editable, word-timed subtitles. Free, private, and ready for your video editor." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SRT Sidecar — subtitles on your terms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { min-height: 100%; }
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: #000; }
      .boot-splash img { display: block; width: min(340px, 72vw); height: auto; }
    </style>
  </head>
  <body style="margin:0">
    <div id="root"><div class="boot-splash" aria-hidden="true"><img src="/logo.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
