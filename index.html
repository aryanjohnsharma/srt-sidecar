      <main class="seo-fallback">
        <h1>SRT Sidecar: word-timed subtitles from audio</h1>
        <p>SRT Sidecar is a browser-based subtitle generator and editor. Transcribe an audio track on your device, review and correct word-level text and timing, group words into subtitle cues, then export an SRT for your video editor.</p>
        <h2>How it works</h2>
        <ol><li>Choose a WAV, MP3, M4A, AAC, or other supported audio file.</li><li>Generate a transcript with Whisper running locally in the browser.</li><li>Edit transcript words and cue timing, then export a validated SRT file.</li></ol>
        <h2>Privacy</h2>
        <p>Audio is decoded and transcribed on the user's device. SRT Sidecar does not upload audio or transcript text to its own server. The browser downloads the speech model from Hugging Face the first time transcription runs.</p>
        <p>Learn more in the <a href="https://github.com/aryanjohnsharma/srt-sidecar">SRT Sidecar source repository</a>.</p>
      </main>
    </noscript>
